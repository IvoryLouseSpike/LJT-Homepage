# Diagnostic: enable GitHub Pages via API using GITHUB_TOKEN
name: Enable Pages via API

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Create Pages site (branch-based)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/IvoryLouseSpike/LJT-Homepage/pages \
            -d '{"build_type":"branch","branch":"gh-pages"}'
          echo
          echo "--- Current Pages status ---"
          curl -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/IvoryLouseSpike/LJT-Homepage/pages
